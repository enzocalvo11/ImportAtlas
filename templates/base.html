<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Assistente de Agendamento de Retirada ImportAtlas">
    <title>{% block title %}ImportAtlas{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body>
    <header class="cabecalho">
      <div class="container cabecalho-conteudo">
        <a class="marca" href="{{ url_for('painel_operacoes') }}" aria-label="ImportAtlas — início">
          <span class="marca-simbolo" aria-hidden="true">IA</span>
          <span>
            <strong>ImportAtlas</strong>
            <small>Agendamento de retirada</small>
          </span>
        </a>
        <span class="selo-demonstracao">Demonstração com dados simulados</span>
      </div>
    </header>

    <main class="container conteudo-principal">
      {% block content %}{% endblock %}
    </main>

    <footer class="rodape">
      <div class="container">Protótipo para o Porto Hack Santos 2026</div>
    </footer>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
